services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=orderdb;Username=postgres;Password=Admin123
      - RabbitMq__Host=rabbitmq
      - RabbitMq__Username=admin
      - RabbitMq__Password=Admin123
      - ConnectionStrings__Redis=redis:6379
    depends_on:
      postgres:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16
    container_name: pg-local
    environment:
      - POSTGRES_PASSWORD=Admin123
      - POSTGRES_DB=orderdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=Admin123
    ports:
      - "5672:5672"     # tətbiqlərin qoşulduğu port (AMQP)
      - "15672:15672"   # idarəetmə paneli (brauzer)
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      
  redis:
    image: redis:7
    container_name: redis-local
    ports:
      - "6379:6379"

volumes:
  pgdata: